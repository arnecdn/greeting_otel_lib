[package]
name = "greeting_otel"
version = "0.30.0"
edition = "2021"

[dependencies]
opentelemetry = {version = "0.30.0",features = ["metrics", "logs"] }
opentelemetry_sdk = {version = "0.30.0",  features = ["rt-tokio", "logs"] }
opentelemetry-otlp = {version = "0.30.0", features = ["tonic", "metrics", "logs", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.30.0", features = ["semconv_experimental"] }
opentelemetry-appender-tracing = {  version = "0.30.1",default-features = false}

tracing-subscriber= {version= "0.3.10",features = ["env-filter","registry", "std"]}
tracing-opentelemetry = "0.31.0"
#tracing-opentelemetry = "0.29.0"
